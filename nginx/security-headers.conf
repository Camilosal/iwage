# Las siete cabeceras, en un solo lugar.
#
# nginx NO hereda los `add_header` del bloque `server` a un `location` que declare cualquier
# `add_header` propio: la regla de herencia es todo-o-nada. Como los diez `location` de
# nginx.conf declaran al menos uno (Cache-Control o X-Cache-Status), las cabeceras de
# `server` desaparecían de TODA respuesta con cuerpo — hojas HTML, /api/, /uploads, assets.
# Medido el 2026-10-06: `curl -sI https://iwage.co/meliponas/tienda` devolvía cero cabeceras
# de seguridad, mientras las puertas 301 legacy (que no declaran ninguna) sí las llevaban.
#
# Por eso cada location que tiene add_header propio debe incluir este archivo. Si se agrega
# un location nuevo con add_header, se olvida el include, y el defecto vuelve sin hacer ruido:
# nginx -t pasa igual. No hay forma de probarlo en config; se comprueba contra el borde.
#
# Alcance: solo los locations que reenvían a Astro. Los tres de Strapi quedan fuera a
# propósito — ver la nota sobre `location ^~ /admin` en nginx.conf.
#
# Y los hosts de medición no son decorativos: esta CSP llegó a las hojas el 2026-10-06 y el
# primer barrido en chromium sin cabeza dejó CUATRO bloqueos — gtag, el pixel de Meta, el beacon
# que Cloudflare inyecta él mismo, y swetrix. Este último es el que no se ve en el fuente:
# `src/config/analytics.ts` declara `https://swetrix.org/swetrix.js`, que es un redirector, y
# CSP evalúa también el destino del redirect (`cdn.jsdelivr.net`). Dejar esos hosts fuera
# silencia la medición entera sin devolver un error: la hoja sale 200 y el console.log es el
# único testigo. La guarda `tests/cabeceras-seguridad.test.mjs` compara los hosts con los que
# el layout inyecta, para que el próximo analytics no se quede fuera igual.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://swetrix.org https://cdn.jsdelivr.net https://www.googletagmanager.com https://connect.facebook.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://analitica.camilosaldarriaga.com https://reservas.iwage.co https://cafe.iwage.co https://recetas.iwage.co https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://www.facebook.com https://connect.facebook.net https://cloudflareinsights.com https://cdn.jsdelivr.net; frame-src 'self' https://reservas.iwage.co https://cafe.iwage.co https://recetas.iwage.co; frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;
