# ── Upstreams ──────────────────────────────────────────
upstream astro_backend {
    server 127.0.0.1:4321;
}
upstream strapi_backend {
    server iwage_strapi:1337;
}

# ── Rate Limiting Zones ───────────────────────────────
limit_req_zone $binary_remote_addr zone=general:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=search:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=booking:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=lead:10m rate=30r/m;

# ── Cache Zones (SWR/ISR) ─────────────────────────────
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=html_cache:10m max_size=100m inactive=24h use_temp_path=off;
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:5m max_size=30m inactive=1h use_temp_path=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=30s;

    # ── Security Headers ──────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://reservas.iwage.co https://cafe.iwage.co https://recetas.iwage.co; frame-src 'self' https://reservas.iwage.co https://cafe.iwage.co https://recetas.iwage.co; frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;

    # ── Gzip Compression ──────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml font/woff2;

    # ── Health check (no cache, no rate limit) ────────
    location = /api/health {
        proxy_pass http://astro_backend;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # ── Strapi Admin ──────────────────────────────────
    location ^~ /admin {
        proxy_pass http://strapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Strapi Uploads (media) ────────────────────────
    location ^~ /uploads {
        proxy_pass http://strapi_backend;
        proxy_set_header Host $http_host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }


    # ── 301 Redirects (legacy routes → new brand paths) ───
    # Meliponas legacy (root-level → /meliponas/)
    location = /tienda { return 301 /meliponas/tienda; }
    location = /polinizacion { return 301 /meliponas/polinizacion; }
    location = /proyectos { return 301 /meliponas/proyectos; }
    location = /estandar { return 301 /meliponas/estandar; }
    location = /nosotros { return 301 /meliponas/nosotros; }
    location = /contacto { return 301 /meliponas/contacto; }

    # Tierras legacy
    location = /inmobiliaria-rural { return 301 /tierras/; }
    location = /propiedades { return 301 /tierras/propiedades; }
    location = /vender { return 301 /tierras/vender; }

    # Naturaleza legacy
    location = /naturaleza { return 301 /naturaleza/; }

    # Gestión legacy
    location = /operacion-turistica { return 301 /gestion/operacion-turistica; }

    # Blog legacy (root blog stays, but old meliponas blog paths)
    location = /meliponas/blog { return 301 /blog; }

    # Café legacy (pedidos eliminado → pedir desde el menú)
    location = /cafe/pedidos { return 301 /cafe/menu; }

    # ── Static Assets (hashed, immutable) ─────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://astro_backend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Property search (rate limited + short cache) ──
    location ~* ^/tierras/(propiedades|api) {
        limit_req zone=search burst=10 nodelay;
        proxy_pass http://astro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache api_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── Booking proxy (strict rate limit) ─────────────
    location ~* ^/(naturaleza|gestion)/.*(reserva|booking) {
        limit_req zone=booking burst=5 nodelay;
        proxy_pass http://astro_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    # ── Lead capture endpoints ────────────────────────
    location ~* ^/api/(contacto|lead) {
        limit_req zone=lead burst=5 nodelay;
        proxy_pass http://astro_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # ── API endpoints (short cache) ───────────────────
    location /api/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://astro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache api_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_methods GET HEAD;
        proxy_cache_use_stale error timeout http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── HTML pages (SWR cache) ────────────────────────
    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://astro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SWR: serve stale on errors
        proxy_cache html_cache;
        proxy_cache_valid 200 120s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }
}
