# ── Upstreams ──────────────────────────────────────────
upstream astro_backend {
    server 127.0.0.1:4321;
}
upstream strapi_backend {
    server iwage_strapi:1337;
}

# ── Rate Limiting Zones ───────────────────────────────
limit_req_zone $binary_remote_addr zone=general:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=search:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=booking:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=lead:10m rate=30r/m;

# ── Cache Zones (SWR/ISR) ─────────────────────────────
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=html_cache:10m max_size=100m inactive=24h use_temp_path=off;
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:5m max_size=30m inactive=1h use_temp_path=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=30s;

    # ── IP real del visitante (Cloudflare Tunnel) ──────
    # El tráfico público llega vía cloudflared desde el host/red docker;
    # sin esto el rate limiting agruparía a todos los visitantes en una IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # ── Security Headers ──────────────────────────────
    # Cubre solo los locations sin `add_header` propio (las puertas 301 legacy y los 404).
    # Los demás necesitan su propio include; ver el porqué en el archivo incluido.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Gzip Compression ──────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml font/woff2;

    # ── Health check (no cache, no rate limit) ────────
    location = /api/health {
        proxy_pass http://astro_backend;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ── Strapi Admin ──────────────────────────────────
    # Los tres locations de abajo reenvían a Strapi y a propósito NO incluyen las cabeceras:
    # Strapi ya emite las suyas (medido el 2026-10-06 en :1337) y su CSP es más estricta que
    # la nuestra — `script-src 'self'` sin 'unsafe-inline', y `img-src ... blob:`. Estando
    # dos cabeceras Content-Security-Policy en la misma respuesta, el navegador aplica la
    # INTERSECCIÓN de ambas: la nuestra habría quitado blob: a las previsualizaciones de la
    # biblioteca de medios y 'unsafe-eval' al panel. Aquí menos cabeceras es más seguro.
    location ^~ /admin {
        client_max_body_size 100m;
        set $strapi_upstream http://strapi_backend;
        proxy_pass $strapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Strapi Admin API (rutas top-level que consume el panel) ─
    # El panel de Strapi v5 llama a estos endpoints en la raíz del dominio
    # (content manager, media library, permisos, i18n). Sin este proxy el
    # panel carga pero falla al listar/editar contenidos o subir medios.
    location ~ ^/(content-manager|content-type-builder|upload|users-permissions|i18n|email)(/|$) {
        client_max_body_size 100m;
        set $strapi_upstream http://strapi_backend;
        proxy_pass $strapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Strapi Uploads (media) ────────────────────────
    location ^~ /uploads {
        set $strapi_upstream http://strapi_backend;
        proxy_pass $strapi_upstream;
        proxy_set_header Host $http_host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }


    # ── 301 Redirects (legacy routes → new brand paths) ───
    # Sin esto nginx arma el `Location` absoluto con SU esquema y su puerto: el visitante
    # que llega por https a `/tienda` recibía `http://iwage.co/meliponas/tienda` y caía del
    # TLS (medido el 2026-10-05: `curl -sI https://iwage.co/tienda` → `location: http://…`).
    # Con la forma relativa el navegador resuelve contra el URL con el que pidió, así que
    # se queda en el esquema que eligió. Es también lo que ya emite el middleware de Astro.
    absolute_redirect off;

    # Meliponas legacy (root-level → /meliponas/)
    location = /tienda { return 301 /meliponas/tienda; }
    location = /polinizacion { return 301 /meliponas/polinizacion; }
    location = /proyectos { return 301 /meliponas/proyectos; }
    # El hub de estándares se disolvió en /meliponas/investigacion (las tres fichas siguen
    # vivas debajo de /meliponas/trazabilidad/). Apuntar a /meliponas/estandar, que nunca
    # existió, dejaba la puerta legacy en un 404.
    location = /estandar { return 301 /meliponas/investigacion; }
    location = /nosotros { return 301 /meliponas/nosotros; }
    location = /contacto { return 301 /meliponas/contacto; }

    # Tierras legacy
    location = /inmobiliaria-rural { return 301 /tierras/; }
    location = /propiedades { return 301 /tierras/propiedades; }
    location = /vender { return 301 /tierras/vender; }

    # Naturaleza legacy
    location = /naturaleza { return 301 /naturaleza/; }

    # Gestión legacy. Destino final, no el intermedio: /gestion/operacion-turistica también
    # se movió a /gestion/propietarios/ y lo resuelve el middleware de Astro. Apuntar aquí al
    # intermedio encadenaba dos 301 para llegar a la hoja.
    location = /operacion-turistica { return 301 /gestion/propietarios/operacion-turistica; }

    # Café legacy (pedidos eliminado → pedir desde el menú)
    location = /cafe/pedidos { return 301 /cafe/menu; }

    # ── Static Assets (hashed, immutable) ─────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://astro_backend;
        proxy_set_header Host $host;
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # ── Property search (rate limited + short cache) ──
    location ~* ^/tierras/(propiedades|api) {
        limit_req zone=search burst=10 nodelay;
        proxy_pass http://astro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache api_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── Booking proxy (strict rate limit) ─────────────
    location ~* ^/(naturaleza|gestion)/.*(reserva|booking) {
        limit_req zone=booking burst=5 nodelay;
        proxy_pass http://astro_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ── Lead capture endpoints ────────────────────────
    location ~* ^/api/(contacto|lead) {
        limit_req zone=lead burst=5 nodelay;
        proxy_pass http://astro_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ── API endpoints (short cache) ───────────────────
    location /api/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://astro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache api_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_methods GET HEAD;
        proxy_cache_use_stale error timeout http_500 http_502 http_503;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── HTML pages (SWR cache) ────────────────────────
    location / {
        # Sin límite general: Cloudflare ya absorbe el tráfico, y los 503 de
        # este bloque caían sobre los rastreadores que llegan en ráfaga.
        proxy_pass http://astro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SWR: serve stale on errors
        proxy_cache html_cache;
        proxy_cache_valid 200 120s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
